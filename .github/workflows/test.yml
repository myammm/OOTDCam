name: Test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.3.app
      - name: Run unit tests
        run: |
          xcodebuild test \
            -project OOTDCam.xcodeproj \
            -scheme OOTDCam \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -only-testing:OOTDCamTests \
            CODE_SIGNING_ALLOWED=NO
